name: "Terraform CI"

on:
#    push:
#        branches:
#            - main
#        paths:
#            - '**/terraform/**'
#    pull_request:

jobs:
    terraform:
        runs-on: ubuntu-latest
        env:
            TF_VERSION: 1.5.5
        steps:
            - uses: actions/checkout@v3
              with:
                  fetch-depth: 0

            - name: Github App Installation Token
              uses: actions/create-github-app-token@v1
              id: github-app-installation-token
              with:
                  app-id: ${{ secrets.GH_APP_ID }}
                  private-key: ${{ secrets.GH_APP_PEM_FILE }}
                  owner: ${{ github.repository_owner }}

            - name: Set git global config
              run: git config --global url.https://x-access-token:${GH_TOKEN}@github.com/.insteadOf ssh://git@github.com/
              env:
                  GH_TOKEN: ${{ steps.github-app-installation-token.outputs.token }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v2
              with:
                  terraform_version: ${{ env.TF_VERSION }}

            - name: Run Terraform fmt
              id: fmt
              run: terraform fmt -diff -check -recursive

            - name: Run Terraform init
              id: init
              run: terraform init
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  AWS_DEFAULT_REGION: eu-west-1
                  GH_TOKEN: ${{ steps.github-app-installation-token.outputs.token }}

            - name: Run Terraform validate
              id: validate
              run: terraform validate -no-color
              env:
                  GH_TOKEN: ${{ steps.github-app-installation-token.outputs.token }}

            - name: Lint Code
              uses: super-linter/super-linter/slim@v4.9.5
              env:
                  VALIDATE_ALL_CODEBASE: true
                  DEFAULT_BRANCH: "main"
                  DISABLE_ERRORS: false
                  VALIDATE_PYTHON: true
                  VALIDATE_BASH: true
                  VALIDATE_JSON: true
                  VALIDATE_MD: true
                  VALIDATE_TERRAFORM: true
                  VALIDATE_YAML: true

            - name: Run Terraform plan
              id: plan
              if: github.event_name == 'pull_request'
              run: terraform plan -no-color
              continue-on-error: true
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  AWS_DEFAULT_REGION: eu-west-1
                  GH_TOKEN: ${{ steps.github-app-installation-token.outputs.token }}

            - name: Terraform Plan Status
              if: steps.plan.outcome == 'failure'
              run: exit 1

            - name: Run Terraform apply
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              run: terraform apply -auto-approve
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  AWS_DEFAULT_REGION: eu-west-1
                  GH_TOKEN: ${{ steps.github-app-installation-token.outputs.token }}
